<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwimLoading — Sponsor Pipeline</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080f1a;
  --bg-card: #0d1728;
  --bg-card2: #111e35;
  --cyan: #38bdf8;
  --text: #f1f5f9;
  --text-sec: #94a3b8;
  --text-muted: #475569;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.14);
  --green: #10b981;
  --amber: #f59e0b;
  --danger: #ef4444;
  --blue: #3b82f6;
  --purple: #a78bfa;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,15,26,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 50%, #0284c7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.nav-brand img { height: 22px; width: auto; -webkit-text-fill-color: initial; }

.nav-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.nav-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-sec); }
.nav-stat span { color: var(--text); font-weight: 600; }

.btn {
  padding: 8px 16px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity 0.15s;
  font-family: inherit;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--cyan); color: #080f1a; }
.btn-ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--text-sec); }

.container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

.page-header { margin-bottom: 32px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 1px; line-height: 1; margin-bottom: 8px; }
.page-sub { color: var(--text-sec); font-size: 14px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }

.filter-btn {
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-sec);
  transition: all 0.15s;
  font-family: inherit;
}
.filter-btn:hover, .filter-btn.active { background: var(--bg-card2); border-color: var(--border-strong); color: var(--text); }
.filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

.search-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 50px;
  padding: 0 14px; height: 36px; flex: 1; max-width: 280px;
}
.search-wrap input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; font-family: inherit; width: 100%; }
.search-wrap input::placeholder { color: var(--text-muted); }

.section { margin-bottom: 40px; }
.section-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.section-count { background: var(--bg-card); border: 1px solid var(--border); border-radius: 50px; padding: 1px 8px; font-size: 10px; color: var(--text-muted); }

.brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

.brand-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  transition: border-color 0.15s; position: relative;
}
.brand-card:hover { border-color: var(--border-strong); }
.brand-card.status-Confirmed { border-left: 2px solid var(--green); }
.brand-card.status-In-Discussion { border-left: 2px solid var(--amber); }
.brand-card.status-Contacted { border-left: 2px solid var(--blue); }
.brand-card.status-Passed { opacity: 0.5; }
.brand-card.is-priority { border-left: 2px solid var(--amber); }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.brand-name { font-size: 15px; font-weight: 700; color: var(--text); }
.brand-country { font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; }

.status-select {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 50px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-sec);
  cursor: pointer; font-family: inherit; flex-shrink: 0; transition: all 0.15s;
}
.status-select[data-status="Idea"] { border-color: var(--border); color: var(--text-muted); }
.status-select[data-status="Researching"] { border-color: var(--purple); color: var(--purple); background: rgba(167,139,250,0.08); }
.status-select[data-status="Contacted"] { border-color: var(--blue); color: var(--blue); background: rgba(59,130,246,0.08); }
.status-select[data-status="In Discussion"] { border-color: var(--amber); color: var(--amber); background: rgba(245,158,11,0.08); }
.status-select[data-status="Confirmed"] { border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.08); }
.status-select[data-status="Passed"] { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.08); }

.badge-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.badge { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: rgba(148,163,184,0.08); color: var(--text-muted); }
.badge-category { background: rgba(56,189,248,0.15); color: var(--cyan); }
.badge-owner { background: rgba(167,139,250,0.15); color: var(--purple); }

.prize-line { font-size: 12px; color: var(--cyan); font-weight: 600; margin-bottom: 6px; }

.meta-row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; }
.meta-item { font-size: 11px; color: var(--text-sec); }
.meta-item strong { color: var(--text); font-weight: 600; }
.meta-item.overdue strong { color: var(--danger); }

.brand-note-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; margin-top: 8px; }

.notes-area {
  width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; color: var(--text); font-family: inherit; resize: vertical;
  min-height: 48px; transition: border-color 0.15s; line-height: 1.5;
}
.notes-area:focus { outline: none; border-color: var(--border-strong); }
.notes-area::placeholder { color: var(--text-muted); }

.text-field {
  width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; color: var(--text); font-family: inherit;
  transition: border-color 0.15s; margin-bottom: 6px;
}
.text-field:focus { outline: none; border-color: var(--border-strong); }
.text-field::placeholder { color: var(--text-muted); }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }

.contact-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 11px; }
.contact-link { color: var(--cyan); text-decoration: none; opacity: 0.85; }
.contact-link:hover { opacity: 1; text-decoration: underline; }

.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
.priority-toggle {
  background: none; border: 1px solid var(--border); border-radius: 50px; padding: 3px 10px; font-size: 10px;
  font-weight: 600; color: var(--text-muted); cursor: pointer; font-family: inherit; transition: all 0.15s;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.priority-toggle.on { border-color: var(--amber); color: var(--amber); background: rgba(245,158,11,0.08); }

.log-toggle {
  background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; font-family: inherit;
  text-decoration: underline; padding: 0;
}
.log-panel { display: none; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
.log-panel.open { display: block; }
.log-entry { font-size: 11px; color: var(--text-sec); margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.log-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.log-entry-meta { color: var(--text-muted); margin-bottom: 2px; }
.log-entry-subject { color: var(--text); font-weight: 600; margin-bottom: 2px; }

.hidden { display: none !important; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 13px; }

.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--bg-card2); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 300;
  transform: translateY(20px); opacity: 0; transition: all 0.2s; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* Login screen */
#loginScreen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px;
}
.login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 360px; width: 100%; text-align: center; }
.login-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; margin-bottom: 6px; }
.login-sub { color: var(--text-sec); font-size: 13px; margin-bottom: 20px; }
.login-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  color: var(--text); font-family: inherit; font-size: 13px; margin-bottom: 12px; outline: none;
}
.login-input:focus { border-color: var(--border-strong); }
.login-status { font-size: 12px; color: var(--text-sec); margin-top: 12px; min-height: 16px; }

/* Add-sponsor modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 400;
  align-items: center; justify-content: center; padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 16px; padding: 24px;
  max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto;
}
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.5px; margin-bottom: 16px; }
.field-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; display: block; }
.field-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  color: var(--text); font-family: inherit; font-size: 13px; margin-bottom: 14px; outline: none;
}
.field-input:focus { border-color: var(--border-strong); }
.field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

@media (max-width: 640px) {
  .nav-stats { display: none; }
  .page-title { font-size: 32px; }
  .brand-grid { grid-template-columns: 1fr; }
  .field-row-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-title">Sponsor Pipeline</div>
    <div class="login-sub">Sign in with your SwimLoading founder account to view and edit.</div>
    <input type="email" id="loginEmail" class="login-input" placeholder="you@example.com" autocomplete="email">
    <button class="btn btn-primary" id="loginBtn" style="width:100%">Send magic link</button>
    <div class="login-status" id="loginStatus"></div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <nav>
    <a class="nav-brand" href="/"><img src="/icons/logo-wave.png" alt="">SwimLoading</a>
    <div class="nav-right">
      <div class="nav-stats">
        <div id="stat-total">— sponsors</div>
        <div>Contacted <span id="n-contacted" style="color:var(--text);font-weight:600">0</span></div>
        <div>Confirmed <span id="n-confirmed" style="color:var(--text);font-weight:600">0</span></div>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">Add sponsor</button>
      <button class="btn btn-ghost" onclick="signOut()">Sign out</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title">Sponsor Pipeline</div>
        <div class="page-sub" id="page-sub">Loading live data from Supabase…</div>
      </div>
    </div>

    <div class="filters">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search sponsors..." oninput="applyFilters()">
      </div>
      <div class="filter-sep"></div>
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" data-filter="priority" onclick="setFilter('priority', this)">Priority</button>
      <div class="filter-sep"></div>
      <button class="filter-btn" data-filter="Idea" onclick="setFilter('Idea', this)">Idea</button>
      <button class="filter-btn" data-filter="Contacted" onclick="setFilter('Contacted', this)">Contacted</button>
      <button class="filter-btn" data-filter="In Discussion" onclick="setFilter('In Discussion', this)">In Discussion</button>
      <button class="filter-btn" data-filter="Confirmed" onclick="setFilter('Confirmed', this)">Confirmed</button>
      <button class="filter-btn" data-filter="Passed" onclick="setFilter('Passed', this)">Passed</button>
    </div>

    <div id="sections-container"></div>
  </div>
</div>

<div class="modal-overlay" id="addModalOverlay">
  <div class="modal">
    <div class="modal-title">Add sponsor</div>
    <label class="field-label">Sponsor name *</label>
    <input class="field-input" id="add-name" placeholder="e.g. Speedo">
    <div class="field-row-2">
      <div>
        <label class="field-label">Category</label>
        <input class="field-input" id="add-category" placeholder="e.g. Swimwear & kit">
      </div>
      <div>
        <label class="field-label">Country</label>
        <input class="field-input" id="add-country" placeholder="SA" value="SA">
      </div>
    </div>
    <label class="field-label">Website</label>
    <input class="field-input" id="add-website" placeholder="https://...">
    <div class="field-row-2">
      <div>
        <label class="field-label">Contact name</label>
        <input class="field-input" id="add-contact-name" placeholder="First Last">
      </div>
      <div>
        <label class="field-label">Contact email</label>
        <input class="field-input" id="add-email" placeholder="name@brand.com">
      </div>
    </div>
    <label class="field-label">Proposed offer</label>
    <input class="field-input" id="add-offer" placeholder="e.g. Monthly challenge prize">
    <div class="field-row-2">
      <div>
        <label class="field-label">Owner</label>
        <input class="field-input" id="add-owner" placeholder="Dave / Lindi">
      </div>
      <div>
        <label class="field-label">Follow-up date</label>
        <input class="field-input" id="add-followup" type="date">
      </div>
    </div>
    <label class="field-label">Next action</label>
    <input class="field-input" id="add-next-action" placeholder="e.g. Send LinkedIn message">
    <label class="field-label">Notes</label>
    <textarea class="field-input notes-area" id="add-notes" placeholder="Why this brand fits, source, etc."></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" id="add-submit" onclick="submitAddSponsor()">Add sponsor</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- Config ----
const SUPABASE_URL = 'https://szgkzuswelntnevobnoh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6Z2t6dXN3ZWxudG5ldm9ibm9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxODY1NTUsImV4cCI6MjA4Mzc2MjU1NX0.UfKqj2OZ-XeyzCy-MZYZqsDWjn_4EKrhgCFR8eIK2NA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let SPONSORS = [];
let activeFilter = 'all';
let currentUserEmail = null;

// ---- Auth ----
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUserEmail = session.user.email;
    showApp();
  } else {
    showLogin();
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (session) {
      currentUserEmail = session.user.email;
      showApp();
    } else {
      currentUserEmail = null;
      showLogin();
    }
  });
}

function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  loadSponsors();
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const statusEl = document.getElementById('loginStatus');
  if (!email) { statusEl.textContent = 'Enter an email address.'; return; }
  document.getElementById('loginBtn').disabled = true;
  statusEl.textContent = 'Sending link…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
  document.getElementById('loginBtn').disabled = false;
  statusEl.textContent = error ? ('Error: ' + error.message) : 'Check your email for a sign-in link.';
});

async function signOut() {
  await sb.auth.signOut();
}

// ---- Data ----
async function loadSponsors() {
  document.getElementById('page-sub').textContent = 'Loading live data from Supabase…';
  const { data, error } = await sb.from('growth_sponsors').select('*').order('created_at', { ascending: true });
  if (error) {
    document.getElementById('page-sub').textContent = 'Could not load sponsors — you may not have founder access on this account (' + currentUserEmail + ').';
    showToast(error.message, true);
    return;
  }
  SPONSORS = data || [];
  document.getElementById('page-sub').textContent = 'Signed in as ' + currentUserEmail + ' — live data, saves instantly.';
  render();
}

function normalizeStatusClass(status) {
  return 'status-' + (status || 'Idea').replace(/\s+/g, '-');
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDate(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
}

function isOverdue(d) {
  if (!d) return false;
  return new Date(d + 'T00:00:00') < new Date(new Date().toDateString());
}

function buildCard(s) {
  const cat = s.category || 'Uncategorised';
  const statusClass = normalizeStatusClass(s.status);
  const priorityClass = s.priority ? 'is-priority' : '';
  const log = Array.isArray(s.conversation_log) ? s.conversation_log : [];

  const statusOptions = ['Idea','Researching','Contacted','In Discussion','Confirmed','Passed'].map(opt =>
    `<option value="${opt}" ${s.status === opt ? 'selected' : ''}>${opt}</option>`
  ).join('');

  const contactBits = [];
  if (s.website) contactBits.push(`<a class="contact-link" href="${escapeHtml(s.website)}" target="_blank" rel="noopener">Website</a>`);
  if (s.contact_email) contactBits.push(`<a class="contact-link" href="mailto:${escapeHtml(s.contact_email)}">${escapeHtml(s.contact_email)}</a>`);
  if (s.instagram) contactBits.push(`<a class="contact-link" href="${escapeHtml(s.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
  if (s.linkedin) contactBits.push(`<a class="contact-link" href="${escapeHtml(s.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);

  const metaBits = [];
  if (s.contact_name) metaBits.push(`<span class="meta-item">Contact: <strong>${escapeHtml(s.contact_name)}</strong></span>`);
  if (s.next_action) metaBits.push(`<span class="meta-item">Next: <strong>${escapeHtml(s.next_action)}</strong></span>`);
  if (s.follow_up_date) metaBits.push(`<span class="meta-item${isOverdue(s.follow_up_date) ? ' overdue' : ''}">Follow up: <strong>${formatDate(s.follow_up_date)}</strong></span>`);

  const logEntries = log.slice().reverse().map(entry => {
    const date = entry.date ? new Date(entry.date).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const dir = entry.direction || '';
    const subj = entry.subject ? escapeHtml(entry.subject) : (entry.summary ? escapeHtml(entry.summary) : '');
    return `<div class="log-entry">
      <div class="log-entry-meta">${date} · ${escapeHtml(dir)}</div>
      ${subj ? `<div class="log-entry-subject">${subj}</div>` : ''}
    </div>`;
  }).join('') || '<div class="log-entry">No log entries yet.</div>';

  return `
<div class="brand-card ${statusClass} ${priorityClass}" id="card-${s.id}" data-id="${s.id}"
     data-name="${escapeHtml((s.sponsor_name||'').toLowerCase())}"
     data-status="${escapeHtml(s.status||'Idea')}"
     data-priority="${s.priority ? '1' : '0'}">
  <div class="card-top">
    <div>
      <div class="brand-name">${escapeHtml(s.sponsor_name)}</div>
      <div class="brand-country">${escapeHtml(s.country || '')}</div>
    </div>
    <select class="status-select" data-status="${escapeHtml(s.status||'Idea')}" onchange="updateStatus('${s.id}', this)">
      ${statusOptions}
    </select>
  </div>
  <div class="badge-row">
    <span class="badge badge-category">${escapeHtml(cat)}</span>
    ${s.owner ? `<span class="badge badge-owner">${escapeHtml(s.owner)}</span>` : ''}
  </div>
  ${s.proposed_offer ? `<div class="prize-line">${escapeHtml(s.proposed_offer)}</div>` : ''}
  ${metaBits.length ? `<div class="meta-row">${metaBits.join('')}</div>` : ''}
  <div class="brand-note-label">Notes</div>
  <textarea class="notes-area" data-id="${s.id}" placeholder="Add notes..." onblur="updateNotes('${s.id}', this)">${escapeHtml(s.notes)}</textarea>
  ${contactBits.length ? `<div class="contact-row">${contactBits.join('')}</div>` : ''}
  <div class="card-footer">
    <button class="log-toggle" onclick="toggleLog('${s.id}')">${log.length} log ${log.length === 1 ? 'entry' : 'entries'}</button>
    <button class="priority-toggle ${s.priority ? 'on' : ''}" onclick="togglePriority('${s.id}', this)">
      ${s.priority ? '★ Priority' : '☆ Priority'}
    </button>
  </div>
  <div class="log-panel" id="log-${s.id}">${logEntries}</div>
</div>`;
}

function render() {
  const container = document.getElementById('sections-container');
  const categories = [...new Set(SPONSORS.map(s => s.category || 'Uncategorised'))].sort();

  if (SPONSORS.length === 0) {
    container.innerHTML = '<div class="empty-state">No sponsors yet — add your first one.</div>';
  } else {
    container.innerHTML = categories.map(cat => {
      const brands = SPONSORS.filter(s => (s.category || 'Uncategorised') === cat);
      return `
<div class="section" data-category="${escapeHtml(cat)}">
  <div class="section-title">${escapeHtml(cat)}<span class="section-count">${brands.length}</span></div>
  <div class="brand-grid">${brands.map(buildCard).join('')}</div>
</div>`;
    }).join('');
  }

  updateStats();
  applyFilters();
}

async function updateStatus(id, sel) {
  const status = sel.value;
  const card = document.getElementById('card-' + id);
  card.className = card.className.replace(/status-\S+/g, '').trim() + ' ' + normalizeStatusClass(status);
  card.dataset.status = status;
  sel.dataset.status = status;
  const { error } = await sb.from('growth_sponsors').update({ status, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { showToast('Save failed: ' + error.message, true); return; }
  const s = SPONSORS.find(x => x.id === id); if (s) s.status = status;
  updateStats();
  applyFilters();
  showToast('Status updated');
}

async function updateNotes(id, textarea) {
  const notes = textarea.value;
  const { error } = await sb.from('growth_sponsors').update({ notes, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { showToast('Save failed: ' + error.message, true); return; }
  const s = SPONSORS.find(x => x.id === id); if (s) s.notes = notes;
  showToast('Notes saved');
}

async function togglePriority(id, btn) {
  const s = SPONSORS.find(x => x.id === id);
  const next = !s.priority;
  const { error } = await sb.from('growth_sponsors').update({ priority: next, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { showToast('Save failed: ' + error.message, true); return; }
  s.priority = next;
  btn.classList.toggle('on', next);
  btn.textContent = next ? '★ Priority' : '☆ Priority';
  const card = document.getElementById('card-' + id);
  card.classList.toggle('is-priority', next);
  card.dataset.priority = next ? '1' : '0';
  applyFilters();
}

function toggleLog(id) {
  document.getElementById('log-' + id).classList.toggle('open');
}

function updateStats() {
  document.getElementById('stat-total').textContent = SPONSORS.length + ' sponsors';
  document.getElementById('n-contacted').textContent = SPONSORS.filter(s => ['Contacted','In Discussion','Confirmed'].includes(s.status)).length;
  document.getElementById('n-confirmed').textContent = SPONSORS.filter(s => s.status === 'Confirmed').length;
}

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const search = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.brand-card').forEach(card => {
    const name = card.dataset.name;
    const status = card.dataset.status;
    const priority = card.dataset.priority === '1';
    let show = true;
    if (search && !name.includes(search)) show = false;
    if (activeFilter === 'priority' && !priority) show = false;
    else if (activeFilter !== 'all' && activeFilter !== 'priority' && status !== activeFilter) show = false;
    card.classList.toggle('hidden', !show);
  });
  document.querySelectorAll('.section').forEach(sec => {
    const visible = sec.querySelectorAll('.brand-card:not(.hidden)').length;
    sec.classList.toggle('hidden', visible === 0);
  });
}

// ---- Add sponsor ----
function openAddModal() { document.getElementById('addModalOverlay').classList.add('open'); }
function closeAddModal() {
  document.getElementById('addModalOverlay').classList.remove('open');
  ['add-name','add-category','add-website','add-contact-name','add-email','add-offer','add-owner','add-followup','add-next-action','add-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('add-country').value = 'SA';
}

async function submitAddSponsor() {
  const name = document.getElementById('add-name').value.trim();
  if (!name) { showToast('Sponsor name is required', true); return; }
  const payload = {
    sponsor_name: name,
    category: document.getElementById('add-category').value.trim() || null,
    country: document.getElementById('add-country').value.trim() || 'SA',
    website: document.getElementById('add-website').value.trim() || null,
    contact_name: document.getElementById('add-contact-name').value.trim() || null,
    contact_email: document.getElementById('add-email').value.trim() || null,
    proposed_offer: document.getElementById('add-offer').value.trim() || null,
    owner: document.getElementById('add-owner').value.trim() || null,
    follow_up_date: document.getElementById('add-followup').value || null,
    next_action: document.getElementById('add-next-action').value.trim() || null,
    notes: document.getElementById('add-notes').value.trim() || null,
    status: 'Idea'
  };
  document.getElementById('add-submit').disabled = true;
  const { data, error } = await sb.from('growth_sponsors').insert(payload).select();
  document.getElementById('add-submit').disabled = false;
  if (error) { showToast('Add failed: ' + error.message, true); return; }
  SPONSORS.push(data[0]);
  render();
  closeAddModal();
  showToast('Sponsor added');
}

// ---- Toast ----
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

initAuth();
</script>
