<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SwimBETTER Report Preview</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/aquasharks-lab/report-builder/report.css?v=2">
  <link rel="stylesheet" href="/aquasharks-lab/analysis/report-view.css?v=17">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="rvbar">
    <div class="grp"><strong>Report preview</strong><label class="grp" style="color:#94a3b8">Fixture
      <select id="fixture"><option value="test-swimmer-a">Test Swimmer A, 200 m (full)</option><option value="test-swimmer-b">Test Swimmer B, sprint (thin source)</option></select></label></div>
    <div class="grp" id="profiles" role="group" aria-label="Communication profile"></div>
    <div class="grp"><button id="print" class="primary">Save as PDF</button></div>
  </div>
  <div class="rvfixture">TEST FIXTURE (synthetic swimmer). Every figure comes from the fixture through the SwimAnalysis model and rule engine. Coaching rules are unapproved.</div>
  <div id="root"></div>
  <script type="module">
    import { analyse } from '/aquasharks-lab/analysis/engine.js';
    import { renderReport } from '/aquasharks-lab/analysis/report-view.js';
    import { PROFILES, PROFILE_IDS } from '/aquasharks-lab/analysis/profiles.js';
    const FIXTURES = {
      'test-swimmer-a': () => import('/aquasharks-lab/analysis/fixtures/test-swimmer-a-200m.js'),
      'test-swimmer-b': () => import('/aquasharks-lab/analysis/fixtures/test-swimmer-b-sprint.js'),
    };
    const qs = new URLSearchParams(location.search);
    const fixtureId = FIXTURES[qs.get('fixture')] ? qs.get('fixture') : 'test-swimmer-a';
    const analysis = (await FIXTURES[fixtureId]()).default;
    const profile = PROFILES[qs.get('profile')] ? qs.get('profile') : analysis.swimmer.communicationProfile;
    document.getElementById('fixture').value = fixtureId;
    document.getElementById('profiles').innerHTML = PROFILE_IDS.map((id) => `<button data-p="${id}" aria-pressed="${id === profile}">${PROFILES[id].label}</button>`).join('');
    const go = (k, v) => { const u = new URLSearchParams(location.search); u.set(k, v); location.search = u.toString(); };
    document.getElementById('profiles').onclick = (e) => { const b = e.target.closest('[data-p]'); if (b) go('profile', b.dataset.p); };
    document.getElementById('fixture').onchange = (e) => go('fixture', e.target.value);
    document.getElementById('print').onclick = () => print();
    document.getElementById('root').innerHTML = renderReport(analyse(analysis, profile).report);
    if (window.lucide) lucide.createIcons();
    document.addEventListener('mousemove', (e) => { document.body.style.setProperty('--mouse-x', e.clientX + 'px'); document.body.style.setProperty('--mouse-y', e.clientY + 'px'); });
    window.__ready = true;
  </script>
</body>
</html>
